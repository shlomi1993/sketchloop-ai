# SketchLoop settings. Copy to sketchloop.toml in the folder you run sketchloop from, or pass --config PATH.
# Command-line flags override these values. Remove a line to use the built-in default.

[generator]
backend = "diffusers"  # fake, diffusers, or t2i-adapter

[generator.diffusers]  # also used by the t2i-adapter backend
mode = "fast"  # fast or quality, omit for the device default
# precision = "float16"  # float16 or float32, omit for float16 on a GPU and float32 on CPU

[models]
dir = "models"  # relative to this file, holds every model, and scripts/download_models.py downloads here

[capture]
source = "camera"  # file or camera, for sketchloop run
camera_index = 0

[preprocessing]
name = "strokes"  # strokes for paper photos, or minimal for clean scans and digital drawings
rotation = 0  # 0, 90, 180, or 270, for sketchloop run
raw = false

[evaluator]
name = "none"  # none, clip-b32, or clip-l14, and scripts/download_models.py fetches the CLIP model named here

[storage]
store = "folder"
runs_dir = "runs"  # relative to this file

[run]
candidates = 4
# seed = 7  # omit for a random seed

[ui]
candidates = 1
capture_interval_seconds = 0.5

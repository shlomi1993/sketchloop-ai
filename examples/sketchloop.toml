# SketchLoop settings. Copy to sketchloop.toml in the folder you run sketchloop from, or pass --config PATH.
# Command-line flags override these values. Remove a line to use the built-in default.

[generator]
backend = "t2i-adapter"  # fake, diffusers, or t2i-adapter

[generator.diffusers]  # also used by the t2i-adapter backend
mode = "fast"  # fast or quality, omit for the device default
# precision = "float16"  # float16 or float32, omit for float16 on a GPU and float32 on CPU

[models]
dir = "models"  # relative to this file, holds every model, and scripts/download_models.py downloads here

[capture]
source = "camera"  # file or camera, for sketchloop dev run
camera_index = 0

[preprocessing]
name = "strokes"  # strokes for paper photos, or minimal for clean scans and digital drawings
rotation = 0  # 0, 90, 180, or 270, for sketchloop dev run
raw = false

[evaluator]
name = "none"  # none, clip-b32, or clip-l14, and scripts/download_models.py fetches the CLIP model named here

[storage]
store = "folder"
runs_dir = "runs"  # relative to this file
export_dir = "data/study-exports"  # where sketchloop study export creates a new folder, relative to this file

[run]
candidates = 4
# seed = 7  # omit for a random seed

[ui]
candidates = 1
capture_interval_seconds = 0.5

[stroke_suggester]  # next-stroke suggestions for guided sketching on the page
name = "controlnet"  # controlnet, which draws new parts with SD 1.5 from the models folder, or fake, which draws test shapes for development, also --stroke-suggester

[stroke_suggester.controlnet]
# precision = "float16"  # float16 or float32, omit for float16 on a GPU and float32 on CPU

[drawing]  # guided sketching
canvas_width = 512  # paper frame width in pixels, a multiple of 8 from 256 to 1024
canvas_height = 360  # 512 x 360 is A4 or Letter in landscape, rounded to the latent grid
save_interval_seconds = 2.0  # seconds between saved captures while a drawing is open, more than 0.5

[prompt_suggester]  # "Suggest a prompt" on the page, chosen apart from the image backend
name = "florence"  # templates, which needs no model, or florence, the local Florence-2-base model from the models folder, also --prompt-suggester

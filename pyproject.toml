[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sketchloop-ai"
version = "0.0.0"
description = "Modular research infrastructure for iterative sketch-based design with generative AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.16.9"]

[project.scripts]
sketchloop = "sketchloop.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "--import-mode=importlib --strict-markers"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "ANN"]
ignore = ["ANN401"]

[tool.ruff.format]
skip-magic-trailing-comma = true
